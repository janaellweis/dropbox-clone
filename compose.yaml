services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dropbox
      POSTGRES_PASSWORD: dropbox_dev
      POSTGRES_DB: dropbox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropbox -d dropbox"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: